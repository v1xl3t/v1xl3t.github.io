<style>
  :root {
    color-scheme: dark light;
    --bg: #0e1116; --ink: #e9edf3; --soft: #a8b2c0;
    --line: #2b323d; --accent: #ffd23f; --accent-ink: #15202b; --bad: #ff9d9d;
  }
  /* Flat, not nested, because CSS nesting is dropped by older engines and a
     dropped block here would leave light mode unreadable. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f4; --ink: #15202b; --soft: #4d5865;
      --line: #c9d2dc; --accent: #8a5a00; --accent-ink: #ffffff; --bad: #8c1d1d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --ink: #e9edf3; --soft: #a8b2c0;
    --line: #2b323d; --accent: #ffd23f; --accent-ink: #15202b; --bad: #ff9d9d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    display: grid; place-items: center; padding: 24px 16px;
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 27rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.25rem; letter-spacing: .01em; }
  p { margin: 0 0 1.1rem; color: var(--soft); font-size: .95rem; }
  label { display: block; margin-bottom: .4rem; font-size: .85rem; color: var(--soft); }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  input {
    flex: 1 1 11rem; min-width: 0; padding: .7rem .8rem;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 80%, var(--ink) 6%);
    color: var(--ink); border: 1px solid var(--line); border-radius: .5rem;
    font: inherit;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    flex: 0 0 auto; padding: .7rem 1.1rem; border: 0; border-radius: .5rem;
    background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 650;
    cursor: pointer;
  }
  button[aria-busy="true"] { opacity: .75; cursor: progress; }
  .note { margin: .9rem 0 0; font-size: .85rem; min-height: 1.4em; }
  .note[data-state="bad"] { color: var(--bad); }
  .hint { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line);
          font-size: .82rem; color: var(--soft); }
  noscript { display: block; margin-top: 1rem; color: var(--bad); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Ivy</h1>
  <p>This page is encrypted. Enter the passphrase to decrypt it in your browser.</p>
  <form id="f" autocomplete="off">
    <label for="pass">Passphrase</label>
    <div class="row">
      <input id="pass" type="password" autocomplete="current-password" autocapitalize="off"
             spellcheck="false" required aria-describedby="note">
      <button type="submit" id="go">Unlock</button>
    </div>
  </form>
  <p class="note" id="note" role="status" aria-live="polite" data-state="idle"></p>
  <div class="hint" id="hint" hidden></div>
  <noscript>This page needs JavaScript, because the decryption happens on your device.</noscript>
</main>
<script>
(function () {
  'use strict';
  var cfg = JSON.parse(document.getElementById('vault-payload').textContent);
  var note = document.getElementById('note');
  var go = document.getElementById('go');
  var pass = document.getElementById('pass');

  if (cfg.hint) {
    var h = document.getElementById('hint');
    h.textContent = cfg.hint;
    h.hidden = false;
  }

  function b64(s) {
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  function say(msg, state) {
    note.textContent = msg;
    note.dataset.state = state || 'idle';
  }

  async function unlock(phrase) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(phrase), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(cfg.salt), iterations: cfg.iter, hash: cfg.hash },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    /* AES-GCM is authenticated, so a wrong passphrase throws here rather than
       returning garbage. There is no hash comparison anywhere in this file. */
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(cfg.iv) }, key, b64(cfg.ct));
    return new TextDecoder().decode(plain);
  }

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var phrase = pass.value;
    if (!phrase) return;
    go.setAttribute('aria-busy', 'true');
    say('Deriving the key. This takes a moment on purpose.');
    try {
      var html = await unlock(phrase);
      /* Replace the document in place so relative asset paths still resolve
         against this URL. */
      document.open();
      document.write(html);
      document.close();
    } catch (err) {
      go.removeAttribute('aria-busy');
      say('That passphrase does not decrypt this page.', 'bad');
      pass.select();
    }
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CADchad</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://cadchad.com/">
<meta http-equiv="refresh" content="0; url=https://cadchad.com/">
<!--
  CADchad moved to https://cadchad.com/ on 2026-10-26.

  GitHub Pages cannot issue a 301, so this is the strongest signal available:
  a zero-delay refresh, a canonical pointing at the new home, and noindex so
  this path stops competing with it.

  The QUERY AND FRAGMENT have to survive. Old share links are of the form
  `#d=<payload>`, and the payload IS the design. A fragment never reaches a
  server, so it is not at risk from the hop itself, but the meta refresh above
  does not carry it, which is why the script below rebuilds the target
  explicitly and runs first in practice.

  replace() rather than assign(), so this page does not sit in the back button
  between the visitor and wherever they came from.
-->
<style>
  html { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; padding: 24px; text-align: center; }
  a { color: inherit; }
</style>
</head>
<body>
<p>
  <noscript>This page has moved. </noscript>
  <a id="go" href="https://cadchad.com/">CADchad is now at cadchad.com</a>
</p>
<script>
  // The app moved off the root of cadchad.com to /app/ on 2026-10-27. The
  // landing page forwards payload-bearing links there by itself, so this
  // works either way, but sending them direct saves a hop on exactly the
  // links that matter most. Anything WITHOUT a payload goes to the landing
  // page, which is where a person who typed the old address wants to be.
  var q = location.search || '', h = location.hash || '';
  var carries = /[#&]d=[A-Za-z0-9_-]/.test(h) || /[?&](models?=|view=render)/.test(q);
  var target = 'https://cadchad.com/' + (carries ? 'app/' : '') + q + h;
  document.getElementById('go').href = target;
  location.replace(target);
</script>
</body>
</html>

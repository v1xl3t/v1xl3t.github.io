<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vi Ellis</title>

<meta http-equiv="refresh" content="0; url=/">
<!--
  This used to be a second, byte-identical copy of the homepage, with the same
  title and the same description, which left two files to keep in step and let a
  search engine pick between them at random. It forwards now, the same way /c/
  and /r/ do, so older links keep working and there is one page to maintain.

  Query and fragment are carried across, so /portfolio/?for=swe still lands on
  the software view.
-->
<style>
  html { color-scheme: dark light; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         font:16px/1.5 ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<p><noscript>This link needs JavaScript, or follow it directly. </noscript><a id="go" href="/">Opening the portfolio…</a></p>
<script>
  var target = "/" + (location.search || "") + (location.hash || "");
  document.getElementById("go").href = target;
  location.replace(target);
</script>
</body>
</html>

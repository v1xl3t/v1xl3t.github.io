<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sound of Data, a generative audio visualisation</title>
        <meta name="description" content="A generative sketch by Vi Ellis that turns a dataset into sound and motion, drawn live in the browser." />
        <style>
          /* Presentation only (does not touch the sketch): the sketch draws a
             fixed 1000x750 canvas; center it and scale it to fill the viewport
             so it fills the run-it-here modal instead of sitting cramped in the
             top-left over a big black void. */
          html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
          /* fill the viewport and scale the 4:3 drawing up to fit (letterboxed).
             p5 hard-codes an inline 1000x750 px size, so override with !important. */
          canvas {
            position: fixed !important; inset: 0 !important;
            width: 100vw !important; height: 100vh !important;
            object-fit: contain !important;
          }
          /* p5 appends the audio button + volume slider to <body>; pin them to a
             subtle corner so they stay reachable without adding a scrollbar. */
          body > button, body > input[type=range] {
            position: fixed; z-index: 10; bottom: 14px;
            font-family: "Courier New", monospace;
          }
          body > button { right: 14px; padding: 6px 10px; cursor: pointer; }
          body > input[type=range] { right: 150px; }
        
  /* Touch targets, from the site-wide audit. */
  @media (pointer: coarse) { button, input[type="range"] { min-height: 44px; } }
  /* The page heading is for screen readers and search results, not the eye. */
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
    </head>
    <body>
        <!-- The page is one full-bleed canvas, so this heading exists for screen
             readers and for search results rather than for the eye. The document
             previously had no body element at all, and the parser was creating an
             implicit one for p5 to append the canvas to. -->
        <h1 class="sr-only">Sound of Data, a generative audio visualisation</h1>
        <script src="p5/p5.js"></script>
        <script src="p5/addons/p5.sound.js"></script>
        <script src="Brackets/sketch/201022dataProject.js"></script>
    </body>
</html>

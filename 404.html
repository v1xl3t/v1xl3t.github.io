<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found</title>
<meta name="robots" content="noindex">
<!--
  Two jobs in one file, because GitHub Pages gives a static site exactly one
  hook for an unmatched path.

  1. Route short links that were not typed in the canonical spelling. The
     generated folders under /s/ are uppercase, since that is the form that fits
     QR alphanumeric mode and the form that goes on a card, but Pages paths are
     case sensitive. So /s/cv lands here rather than at /s/CV. This page
     uppercases the slug, looks it up in s/links.json, and forwards.

     It also forgives a near miss. One wrong character in a four character slug
     is common when someone types it off a card, so a single close match is
     offered rather than a dead end.

  2. Be an actual 404 for everything else, which the default page is not.

  The status code really is 404 here. A browser still runs this script, so the
  redirect works, but a link checker will correctly call the miss a miss.
-->
<style>
  :root { color-scheme: dark light; --ink:#e6eaf0; --bg:#0e1116; --soft:#9aa5b4; --accent:#6ea8ff; }
  @media (prefers-color-scheme: light) { :root { --ink:#15202b; --bg:#eef1f4; --soft:#4a5a6a; --accent:#1f5fb0; } }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); display:grid;
         place-items:center; padding:24px; text-align:center;
         font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:34rem; }
  h1 { font-size:clamp(22px,5vw,30px); margin:0 0 8px; }
  p { color:var(--soft); margin:0 0 18px; }
  code { background:#8883; padding:1px 6px; border-radius:5px; word-break:break-all; }
  a { color:var(--accent); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn { display:inline-block; border:1px solid #8886; border-radius:99px; padding:7px 16px;
         text-decoration:none; color:var(--ink); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  #hunting { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="h">Nothing at that address</h1>
  <p id="p">The page <code id="what"></code> does not exist.</p>
  <div class="row" id="actions">
    <a class="btn primary" href="/">Portfolio</a>
    <a class="btn" href="/apps/">Everything I have built</a>
  </div>
</main>
<script>
(function () {
  var path = location.pathname.replace(/\/+$/, '');
  document.getElementById('what').textContent = path + location.search;

  var m = path.match(/^\/s\/([^\/]+)$/i);
  if (!m) return;

  var slug = decodeURIComponent(m[1]).toUpperCase();
  document.getElementById('h').textContent = 'Checking that short link…';
  document.getElementById('p').textContent = '';
  document.getElementById('actions').style.display = 'none';

  function give(title, note, target) {
    document.getElementById('h').textContent = title;
    var p = document.getElementById('p');
    p.textContent = note + ' ';
    if (target) {
      var a = document.createElement('a');
      a.href = target; a.textContent = target;
      p.appendChild(a);
    }
    document.getElementById('actions').style.display = '';
  }

  // True when a and b are one edit apart: a single substitution, insertion or
  // deletion. Enough to forgive a slug typed off a card, tight enough that it
  // will not send someone to the wrong page.
  function near(a, b) {
    if (a === b) return true;
    var d = a.length - b.length;
    if (d > 1 || d < -1) return false;
    var i, j;
    if (d === 0) {
      var diff = 0;
      for (i = 0; i < a.length; i++) if (a[i] !== b[i] && ++diff > 1) return false;
      return diff === 1;
    }
    var shorter = d === 1 ? b : a, longer = d === 1 ? a : b;
    var skipped = 0;
    for (i = 0, j = 0; j < longer.length; j++) {
      if (i < shorter.length && shorter[i] === longer[j]) i++;
      else if (++skipped > 1) return false;
    }
    return true;
  }

  /* Two words that are on no menu and in no index. Yes, they are readable in
     this file: an easter egg you have to read the source to find is still an
     easter egg, and the kind of person who reads the source is the audience. */
  var UNLISTED = { ABYSS: '/hp/found/', DESCEND: '/hp/found/' };
  if (UNLISTED[slug]) { location.replace(UNLISTED[slug]); return; }

  fetch('/s/links.json', { cache: 'no-cache' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var links = (d && d.links) || {};
      if (links[slug]) { location.replace(links[slug].url); return; }
      var keys = Object.keys(links);
      var close = keys.filter(function (k) { return near(k, slug); });
      if (close.length === 1) {
        give('Close. Did you mean ' + close[0] + '?',
             'There is no /s/' + slug + '. The nearest one is', '/s/' + close[0]);
        return;
      }
      give('No short link called ' + slug,
           'All of them are listed at', '/s/');
    })
    .catch(function () {
      give('Could not check that short link', 'Try', '/s/');
    });
})();
</script>
</body>
</html>

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: No em/en dashes in portfolio copy
        run: |
          if grep -rIlP "[\x{2013}\x{2014}]" index.html apps/index.html ; then
            echo "::error::Em or en dash found in the files listed above (use a hyphen)."
            exit 1
          fi
          echo "Dash check passed."

      # Patterns are salted hashes, never plaintext, because this repo is public
      # and a gate that names what it is looking for defeats itself. Hits print a
      # file and line only, so the CI log stays clean too.
      - name: Deadname scan (tracked files and filenames)
        env:
          DEADNAME_PATTERNS: ${{ secrets.DEADNAME_PATTERNS }}
        run: node .github/scripts/deadname-scan.mjs .

      - name: Install Playwright (Chromium)
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Smoke test (serve + headless load)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          node .github/scripts/smoke.mjs http://localhost:8080
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      # Legibility gate. Every text node, both themes, real composited backgrounds.
      - name: WCAG AA contrast gate (both themes)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          node .github/scripts/contrast.mjs http://localhost:8080 / /apps/
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      # The gate above only measures text that is actually rendered, and the
      # media modal stays hidden until a thumbnail is clicked. That blind spot is
      # how the caption once shipped dark-on-dark in light mode.
      - name: Lightbox contrast gate (both themes)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          node .github/scripts/lightbox-contrast.mjs http://localhost:8080
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      # /hp/ cannot be measured by the gate above. It animates its palette from
      # scroll depth, so one sample is one arbitrary moment, and six runs against
      # an unchanged page once reported 28, 62, 92, 94, 109 and 146 failures.
      # This gate sweeps a fixed ladder of scroll depths instead, runs the whole
      # sweep twice and refuses to grade if the two disagree, and compares against
      # a recorded baseline of accepted failures. HP is therefore a ratchet: it
      # may improve, it may not regress. Re-record with --update-baseline after a
      # deliberate change.
      #
      # BACK TO OBSERVATION MODE 2026-08-09, and the reason is worth keeping.
      # Two runs blocked main by reporting the instrument unstable: same 49 keys
      # both sweeps, but four headings in the crossfade band drifted 1.3 vs 1.5,
      # over the 0.05 tolerance. That is the gate doing exactly what it was built
      # to do, refusing to grade rather than emit a number nobody can trust, so
      # the bug is not the refusal. It is that the sweep addresses scroll by
      # FRACTION of scrollHeight while HP lazy-loads its descent images, so
      # scrollHeight is still moving and the same fraction lands on a slightly
      # different palette moment. In that band the palette is changing fast
      # enough for a few pixels to move a ratio by 0.2.
      #
      # The fix is to settle the page height first (scroll to the bottom, let
      # every lazy layer load, scroll back, measure max ONCE) and sweep absolute
      # pixels. Until that is done this reports without blocking, because a gate
      # that red-lights unrelated CADence pushes gets switched off by everyone,
      # and then it protects nothing.
      - name: HP contrast ratchet (scroll-depth sweep)
        continue-on-error: true
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          node .github/scripts/hp-contrast-gate.mjs http://localhost:8080
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS

      # Phone width and Vi's vertical desktop monitor. Nothing may need zooming
      # or sideways scrolling on a vertical viewport.
      - name: Vertical viewport gate (no horizontal scroll)
        run: |
          python3 -m http.server 8080 >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          node .github/scripts/viewport.mjs http://localhost:8080 / /apps/
          STATUS=$?
          kill $SRV 2>/dev/null || true
          exit $STATUS
